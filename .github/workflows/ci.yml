name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # O GitHub Actions já define CI=true: o Playwright passa a proibir test.only, repete uma vez
      # o teste que falhar e deixa a suíte visual de fora (snapshots do Windows).
      - run: npm run verify

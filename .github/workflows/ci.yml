name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um push novo no mesmo ramo cancela a verificação anterior, que ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A versão do Playwright no package-lock.json escolhe a imagem do job seguinte: quando o
  # Dependabot sobe o Playwright, a imagem acompanha.
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  verify:
    needs: playwright
    runs-on: ubuntu-latest
    # A imagem oficial do Playwright já traz os três navegadores e as bibliotecas do sistema. Antes,
    # o --with-deps instalava essas bibliotecas pelo apt a cada run, e no primeiro run o espelho do
    # Ubuntu levou mais de 25 min e estourou o tempo. O usuário 1001 é o do runner: o Firefox não
    # roda como root numa pasta pessoal de outro usuário.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --user 1001
    # A suíte tem uns 900 testes de navegador nos três motores: perto de 10 min só ela no runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        # A mesma versão que a Netlify e a Cloudflare Pages leem no build.
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Só as dependências que chegam ao site: a cadeia do Stylelint (braces) tem um alerta sem
      # versão corrigida publicada, e é ferramenta de desenvolvimento, fora do dist/.
      - run: npm audit --omit=dev --audit-level=high
      # O GitHub Actions já define CI=true: o Playwright passa a proibir test.only, repete uma vez
      # o teste que falhar e deixa a suíte visual de fora (snapshots do Windows).
      - run: npm run verify
      # Traces dos testes que falharam, mesmo os que passaram na repetição, para investigar
      # sem rodar de novo.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

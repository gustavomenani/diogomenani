name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um push novo no mesmo ramo cancela a verificação anterior, que ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A suíte tem uns 900 testes de navegador nos três motores, e num runner de 2 vCPU o Playwright
    # usa 1 worker: só ela pode levar perto de 15 min. Depois do primeiro run, ajustar para cerca de
    # 1,5 vez a duração real.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        # A mesma versão que a Netlify e a Cloudflare Pages leem no build.
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Só as dependências que chegam ao site: a cadeia do Stylelint (braces) tem um alerta sem
      # versão corrigida publicada, e é ferramenta de desenvolvimento, fora do dist/.
      - run: npm audit --omit=dev --audit-level=high
      # Os três motores dos testes de comportamento; do Chromium, só o modo headless.
      - run: npx playwright install --with-deps --only-shell chromium firefox webkit
      # O GitHub Actions já define CI=true: o Playwright passa a proibir test.only, repete uma vez
      # o teste que falhar e deixa a suíte visual de fora (snapshots do Windows).
      - run: npm run verify
      # Traces dos testes que falharam, mesmo os que passaram na repetição, para investigar
      # sem rodar de novo.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

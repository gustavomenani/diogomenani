name: Depuração

on:
  push:
    branches: [depuracao-ci]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test tests/e2e/zz-depuracao.spec.ts --retries=0 --reporter=list
        continue-on-error: true
      - run: npx playwright test tests/e2e/startup.spec.ts --project=firefox --project=webkit --repeat-each=4 --retries=0 --reporter=list
        continue-on-error: true
      - run: npx playwright test tests/e2e/states.spec.ts tests/e2e/topic.spec.ts --project=firefox --project=webkit --repeat-each=2 --retries=0 --reporter=list
        continue-on-error: true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: depuracao
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

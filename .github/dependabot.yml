# Atualizações semanais das dependências do npm e das actions do CI: cada uma vira um pull request,
# que o CI confere com o npm run verify antes do merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
